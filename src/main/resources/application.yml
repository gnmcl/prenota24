spring:
  application:
    name: prenota24
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true


  task:
    execution:
      pool:
        core-size: 4
        max-size: 16

resend:
  api-key: ${RESEND_API_KEY}
  from-address: ${RESEND_FROM_ADDRESS}
  from-name: ${RESEND_FROM_NAME:Prenota24}

jwt:
  secret: ${JWT_SECRET}
  access-token-minutes: ${JWT_ACCESS_MINUTES:15}
  refresh-token-days: ${JWT_REFRESH_DAYS:7}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

server:
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO

