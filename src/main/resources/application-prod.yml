# ── PROD profile ─────────────────────────────────────────
# All values from env vars. No fallbacks.
# Run with: SPRING_PROFILES_ACTIVE=prod

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    com.prenota24: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
